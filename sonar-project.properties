sonar.organization=overnightworks
sonar.projectKey=overnightworks_design
sonar.sources=src,scripts
sonar.tests=tests,src
sonar.test.inclusions=tests/**,src/**/*.test.ts
# SonarCloud indexes no .svelte file, so the components' records stay unresolved; the end-to-end suites prove their markup.
sonar.javascript.lcov.reportPaths=lcov.info
