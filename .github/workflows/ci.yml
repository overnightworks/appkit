name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A push is checked against its previous tip; the all-zero SHA marks a
      # branch's first push, which falls back to the parent commit.
      - name: Check for whitespace errors and conflict markers
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${PULL_REQUEST_BASE}"
          elif [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          else
            base="${PUSH_BEFORE}"
          fi
          git diff --check "${base}" HEAD -- . ':(exclude)patches/'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      # pnpm takes its version from package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: package.json
          # Without check-latest a range resolves from the runner's tool cache, which can lag the newest major.
          check-latest: true
      # The tarball test's pnpm pack runs prepack, which needs node_modules.
      - name: Install, type-check and test the Svelte component
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run test
      - name: Prove production consumers of the tarball paint the sign-in page
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:consumer
      - name: Run the package tests and build the wheel
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest -q tests
          uv build --wheel

  quality:
    name: quality
    needs: [checks]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@07bdf7c478ac9cc9cd348b180abd3cbc9d873f23 # v0.9.2
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
