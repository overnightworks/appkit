name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Every non-pull-request run gets its own group: GitHub keeps one pending run per group and cancels it when another queues, so a shared group on main loses runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A push is checked against its previous tip; the all-zero SHA marks a
      # branch's first push, which falls back to the parent commit.
      - name: Check for whitespace errors and conflict markers
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${PULL_REQUEST_BASE}"
          elif [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          else
            base="${PUSH_BEFORE}"
          fi
          git diff --check "${base}" HEAD -- . ':(exclude)patches/'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      # pnpm takes its version from package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: package.json
          # Without check-latest a range resolves from the runner's tool cache, which can lag the newest major.
          check-latest: true
      # The tarball test's pnpm pack runs prepack, which needs node_modules.
      - name: Install, type-check and test the Svelte component
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run test:coverage
      - name: TurnOutcome is what agents' pinned release says
        run: |
          uv run --frozen python scripts/generate_turn_outcome.py
          git diff --exit-code -- src/lib/turn-outcome.ts scripts/agents_vocabulary_pin.toml
      - name: Prove production consumers of the tarball paint the sign-in page
        run: |
          pnpm exec playwright install chromium
          pnpm run test:consumer
      # loadfile keeps test_npm_package.py on one worker: its pnpm pack runs prepack, which rewrites the shared svelte-dist/.
      - name: Run the package tests and build the wheel
        run: |
          uv run --frozen --extra catalogs design-catalogs --check
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen --extra catalogs pytest -q -n auto --dist loadfile --cov=design --cov=scripts --cov-branch --cov-fail-under=100 --cov-report=term --cov-report=xml:coverage/python.xml tests
          uv build --wheel
      - name: Upload the unit-test and Python coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unit-coverage
          path: |
            coverage/lcov.info
            coverage/python.xml
          if-no-files-found: error
          retention-days: 1

  quality:
    name: quality
    needs: [checks]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@be32abeb120d29f75ee7ea456d6e510ae001de04 # v0.12.0
    with:
      coverage-artifact: unit-coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
