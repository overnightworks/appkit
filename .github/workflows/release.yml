name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, X.Y.Z
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

# bash runs with pipefail, so a hash pipeline whose first command fails fails its step.
defaults:
  run:
    shell: bash

jobs:
  gate:
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: overnightworks/quality/.github/workflows/release-gate.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    with:
      version: ${{ inputs.version }}

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # The checkout takes github.sha, the dispatch's commit; the gate refuses unless main's head is still that commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse unless the checkout is the commit the gate judged
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$COMMIT" ]; then
            echo "Refused: the checkout is $head, not the gated commit $COMMIT." >&2
            exit 1
          fi

      - name: Refuse unless pyproject.toml and package.json carry the version
        run: |
          python_version=$(python3 -I -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])' <pyproject.toml)
          npm_version=$(jq -r .version package.json)
          if [ "$python_version" != "$VERSION" ]; then
            echo "Refused: pyproject.toml carries $python_version, not $VERSION." >&2
            exit 1
          fi
          if [ "$npm_version" != "$VERSION" ]; then
            echo "Refused: package.json carries $npm_version, not $VERSION." >&2
            exit 1
          fi

      # A release build reads no cache, so no earlier run can change what it ships.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      # pnpm takes its version from package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
          package-manager-cache: false

      # pnpm pack runs prepack, which needs node_modules.
      - name: Build the wheel, the npm tarball and the token list
        run: |
          pnpm install --frozen-lockfile
          uv build --wheel --no-create-gitignore --out-dir dist
          pnpm pack --pack-destination dist
          scripts/list_tokens src/design/static/design.css >"dist/design-$VERSION-tokens.txt"

      - name: Refuse unless dist holds exactly the wheel, the tarball and the token list
        run: |
          expected=$(printf '%s\n' \
            "design-$VERSION-tokens.txt" \
            "overnightworks-design-$VERSION.tgz" \
            "overnightworks_design-$VERSION-py3-none-any.whl")
          found=$(LC_ALL=C ls -A dist)
          if [ "$found" != "$expected" ]; then
            echo "Refused: dist holds" >&2
            echo "$found" >&2
            echo "but only these belong in it:" >&2
            echo "$expected" >&2
            exit 1
          fi

      - name: Write the notes that pin the uploaded wheel and tarball by their hashes
        id: notes
        working-directory: dist
        run: |
          wheel=(*.whl)
          tarball=(*.tgz)
          wheel_sha256=$(sha256sum "${wheel[0]}" | cut -d' ' -f1)
          tarball_integrity=sha512-$(openssl dgst -sha512 -binary "${tarball[0]}" | base64 -w0)
          download="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          {
            echo 'notes<<NOTES'
            echo 'The wheel, pinned by URL and sha256:'
            echo
            echo '```'
            echo "$download/${wheel[0]}#sha256=$wheel_sha256"
            echo '```'
            echo
            echo "The tarball's URL and the integrity pnpm writes into the lockfile:"
            echo
            echo '```'
            echo "$download/${tarball[0]}"
            echo "$tarball_integrity"
            echo '```'
            echo 'NOTES'
          } >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  tag:
    needs: [gate, build]
    permissions:
      contents: write
    uses: overnightworks/quality/.github/workflows/release-tag.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
      artifact: release-files
      notes: ${{ needs.build.outputs.notes }}
