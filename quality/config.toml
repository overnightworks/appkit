[gate]
mandatory_jobs = ["checks"]

[[root.allow]]
entry = "tsconfig.json"
reason = "svelte-check and the editor find the TypeScript configuration at the root"

[[root.allow]]
entry = "vitest.config.ts"
reason = "vitest finds its configuration at the root"

[[root.allow]]
entry = "patches/"
reason = "pnpm reads patchedDependencies from its default patches/ folder at the root"

[[layout.allow]]
path = "src/design/static/fonts/open-sans-LICENSE"
rule = "file-suffix"
reason = "licence text shipped verbatim beside the font it covers"

[[layout.allow]]
path = "src/design/static/fonts/oswald-LICENSE"
rule = "file-suffix"
reason = "licence text shipped verbatim beside the font it covers"

[[layout.allow]]
path = "tests/test_wheel.py"
rule = "test-layout"
reason = "tests the built wheel and its release scripts, not a module of src/design"

[[layout.allow]]
path = "tests/test_npm_package.py"
rule = "test-layout"
reason = "tests the packed npm tarball, not a module of src/design"

[[layout.allow]]
path = "tests/test_turn_outcome_generator.py"
rule = "test-layout"
reason = "tests scripts/generate_turn_outcome.py, not a module of src/design"
