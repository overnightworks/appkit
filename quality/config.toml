[gate]
mandatory_jobs = ["checks"]

[[root.allow]]
entry = "CHANGELOG.md"
reason = "release history that consumers read at the repository root; no owner directory exists for it"

[[root.allow]]
entry = "tsconfig.json"
reason = "svelte-check and the editor find the TypeScript configuration at the root"

[[root.allow]]
entry = "vitest.config.ts"
reason = "vitest finds its configuration at the root"

[[root.allow]]
entry = "patches/"
reason = "pnpm reads patchedDependencies from its default patches/ folder at the root"

[[python.allow]]
path = "pyproject.toml"
reason = "the wheel is data-only and its consumers pin Python 3.12 (songmaker >=3.12,<3.13; edge >=3.12), so a 3.14 floor would make it uninstallable for both"

[[layout.allow]]
path = "src/appkit/static/fonts/open-sans-LICENSE"
rule = "file-suffix"
reason = "licence text shipped verbatim beside the font it covers"

[[layout.allow]]
path = "src/appkit/static/fonts/oswald-LICENSE"
rule = "file-suffix"
reason = "licence text shipped verbatim beside the font it covers"

[[layout.allow]]
path = "tests/test_wheel.py"
rule = "test-layout"
reason = "tests the built wheel and its release scripts, not a module of src/appkit"

[[layout.allow]]
path = "tests/test_npm_package.py"
rule = "test-layout"
reason = "tests the packed npm tarball, not a module of src/appkit"

[[layout.allow]]
path = "tests/test_publish_release.py"
rule = "test-layout"
reason = "tests the release script, not a module of src/appkit"
