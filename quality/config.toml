[gate]
mandatory_jobs = ["checks"]

[[root.allow]]
entry = "CHANGELOG.md"
reason = "release history that consumers read at the repository root; no owner directory exists for it"

[[root.allow]]
entry = "grammar.html"
reason = "frozen artefact that leaves with overnightworks/appkit#30"

[[root.allow]]
entry = "ui-style.css"
reason = "frozen artefact that leaves with overnightworks/appkit#30"

[[python.allow]]
path = "pyproject.toml"
reason = "the wheel is data-only and its consumers pin Python 3.12 (songmaker >=3.12,<3.13; edge >=3.12), so a 3.14 floor would make it uninstallable for both"

[[layout.allow]]
path = "src/appkit/static/fonts/open-sans-LICENSE"
rule = "file-suffix"
reason = "licence text shipped verbatim beside the font it covers"

[[layout.allow]]
path = "src/appkit/static/fonts/oswald-LICENSE"
rule = "file-suffix"
reason = "licence text shipped verbatim beside the font it covers"

[[layout.allow]]
path = "tests/test_wheel.py"
rule = "test-layout"
reason = "tests the built wheel and its release scripts, not a module of src/appkit"
