<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenten rufen und bitten zu gehen – Bild</title>
<!-- A picture for the operator to bless, not component code. The token values below are copied from
     src/design/static/design.css (light, dark, and the prefers-color-scheme block); the fonts are not
     embedded, so the page falls back to the stacks' system fonts and makes no external request.
     HopIn's stage, skat's felt and brass plates are the apps' own colours, drawn plainly. -->
<style>
:root {
	--bg: #f4f4f6; --bg-deep: #e8e8ec; --surface: #ffffff; --surface-hover: #ebebed; --border: #d0d0d4;
	--text: #1a1a1e; --text-muted: #555; --card-bg: rgba(255, 255, 255, 0.9); --header-bg: #f0f0f2;
	--ok: #1e7a1e; --ok-soft: #e0f5e0; --busy: #9a6200; --busy-soft: #fef3e0; --fail: #c02020; --fail-soft: #fde8e8;
	color-scheme: light;
	--font-display: 'Oswald', Impact, sans-serif;
	--font-body: 'Open Sans', Arial, sans-serif;
}
:root[data-theme='dark'] {
	--bg: #0d0d0d; --bg-deep: #050508; --surface: #111; --surface-hover: #1a1a1a; --border: #333;
	--text: #e0e0e0; --text-muted: #888; --card-bg: rgba(13, 13, 13, 0.85); --header-bg: #0a0a0a;
	--ok: #44aa44; --ok-soft: #1a3a1a; --busy: #f0a030; --busy-soft: #2a1f10; --fail: #ff4444; --fail-soft: #3a1a1a;
	color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme='light']) {
		--bg: #0d0d0d; --bg-deep: #050508; --surface: #111; --surface-hover: #1a1a1a; --border: #333;
		--text: #e0e0e0; --text-muted: #888; --card-bg: rgba(13, 13, 13, 0.85); --header-bg: #0a0a0a;
		--ok: #44aa44; --ok-soft: #1a3a1a; --busy: #f0a030; --busy-soft: #2a1f10; --fail: #ff4444; --fail-soft: #3a1a1a;
		color-scheme: dark;
	}
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
svg { flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
button { font: inherit; color: inherit; }

/* page */
.page-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 24px 12px; }
h1 { margin: 0; font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: .02em; }
.theme { min-height: 44px; padding: 0 16px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 14px; }
.theme:hover { background: var(--surface-hover); }
.scene { padding: 20px 24px 32px; border-top: 1px solid var(--border); }
h2 { margin: 0 0 14px; font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: .02em; }
.frames { display: flex; flex-wrap: wrap; gap: 28px 24px; align-items: flex-start; }
figure { margin: 0; max-width: 100%; }
figcaption { max-width: 390px; margin-top: 8px; font-size: 13px; line-height: 1.4; color: var(--text-muted); }
.frame { position: relative; overflow: hidden; border: 1px solid var(--border); font-size: 14px; }
.phone { width: 390px; height: 760px; border-radius: 28px; }
.phone.short { height: 600px; }
.wide { width: 800px; height: 500px; border-radius: 10px; }
@media (max-width: 860px) {
	.scene { padding: 16px 0 28px; }
	.scene h2, figcaption { padding: 0 14px; }
	.page-head { padding: 16px 14px 10px; }
	figure { width: 100%; }
	.phone { width: 100%; max-width: 390px; }
	.wide { zoom: .4875; }
}

/* the AI mark: an outlined pill with its text, „KI“ in this German picture */
.ai-mark { display: inline-flex; align-items: center; flex: none; border: 1.5px solid currentColor; border-radius: 999px; padding: 0 5px; font-size: .6rem; font-weight: 750; letter-spacing: .04em; line-height: 1.5; }

/* the control: identical in every scene */
.agent-control ul { margin: 0; padding: 0; list-style: none; }
.agent { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 8px 0 14px; font-size: 14px; }
.agent > .ai-mark { color: var(--text-muted); }
.agent-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.act { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px 0 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text); font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.act svg { width: 15px; height: 15px; color: var(--text-muted); }
.act:hover { background: var(--surface-hover); }
.act:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
.pending { display: inline-flex; align-items: center; gap: 8px; padding-right: 6px; color: var(--text-muted); font-size: 13px; white-space: nowrap; }
.dots { display: inline-flex; align-items: center; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .6; }
@media (prefers-reduced-motion: no-preference) {
	.dots i { animation: hop 1.2s ease-in-out infinite; }
	.dots i:nth-child(2) { animation-delay: .12s; }
	.dots i:nth-child(3) { animation-delay: .24s; }
}
@keyframes hop { 0%, 60%, 100% { translate: 0 0; opacity: .45; } 30% { translate: 0 -5px; opacity: 1; } }
.banner { display: flex; gap: 10px; align-items: flex-start; margin: 6px 14px 4px; padding: 10px 12px; border: 1px solid var(--fail); border-left-width: 3px; border-radius: 4px; background: var(--fail-soft); color: var(--text); font-size: 13.5px; text-align: left; }
.fail-shape { margin-top: 3px; display: inline-flex; color: var(--fail); }
.fail-shape i { width: 12px; height: 12px; flex: none; display: inline-block; background: var(--fail); clip-path: polygon(50% 0%, 100% 100%, 0% 100%); }
.empty-note { margin: 0; padding: 10px 14px 12px; color: var(--text-muted); font-size: 13.5px; line-height: 1.4; }
/* touch: rows and targets at 44 px */
.phone .agent, .phone .mrow { min-height: 44px; }
.phone .act::after { content: ''; position: absolute; inset: -6px -2px; }

/* legend */
.legend { display: flex; flex-wrap: wrap; gap: 20px; width: 640px; max-width: 100%; padding: 18px; border-radius: 10px; background: var(--surface); }
.cand { flex: 1 1 260px; display: grid; gap: 12px; }
.cand h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-muted); }
.lone { border: 1px solid var(--border); border-radius: 6px; padding: 4px 0; }
.plate-demo { display: flex; justify-content: center; padding: 18px; border-radius: 6px; background: radial-gradient(circle at 50% 40%, #2f7a45, #1b4f2d); }

/* HopIn */
.hopin { background: #0b0b0e; color: #eee; }
.stage { position: absolute; inset: 14px 14px 96px; display: grid; gap: 10px; grid-template-rows: 1fr 1fr; }
.wide .stage { inset: 16px 16px 92px; grid-template-rows: none; grid-template-columns: 1fr 1fr; }
.vtile { position: relative; border-radius: 14px; background: linear-gradient(160deg, #34343b, #232328); }
.vtile.two { background: linear-gradient(160deg, #2c2f38, #1e2027); }
.vtile.two .vname { top: 10px; bottom: auto; }
.vname { position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: rgba(0, 0, 0, .55); font-size: 13px; }
.cbar { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; gap: 14px; }
.cbtn { display: inline-grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; background: #2a2a31; color: #eee; }
.cbtn svg { width: 24px; height: 24px; }
.cbtn.more svg { fill: currentColor; }
.cbtn.on { background: #eee; color: #111; }
.cbtn.leave { background: #4a2a2e; }
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); }
.wide .scrim { display: none; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 0 18px; border-radius: 30px 30px 0 0; background: var(--surface); color: var(--text); box-shadow: 0 -8px 30px rgba(0, 0, 0, .35); }
.grabber { display: block; width: 38px; height: 4px; margin: 0 auto 8px; border-radius: 2px; background: var(--border); }
.popover { position: absolute; bottom: 86px; left: calc(50% + 34px - 140px); width: 280px; padding: 6px 0 2px; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); color: var(--text); box-shadow: 0 10px 34px rgba(0, 0, 0, .45); }
.mrow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 14px; border: none; background: none; font-size: 14px; text-align: left; cursor: pointer; }
.mrow:hover { background: var(--surface-hover); }
.mrow svg { width: 16px; height: 16px; color: var(--text-muted); }
.mhead { margin-top: 4px; padding: 10px 14px 4px; border-top: 1px solid var(--border); font-family: var(--font-display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
.agent-control { padding-bottom: 4px; }
.legal { display: flex; flex-wrap: wrap; font-size: 12px; }
.legal.menu { gap: 2px 12px; padding: 8px 14px 6px; border-top: 1px solid var(--border); font-size: 11.5px; }
.legal a { display: inline-flex; align-items: center; min-height: 24px; color: var(--text-muted); text-decoration: none; }
.legal a:hover { color: var(--text); }

/* skat */
.skat { background: #123d22; color: #f3efe2; }
.felt { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #2f7a45 0%, #225f36 55%, #17462a 100%); }
.standalone .felt { top: 52px; }
.skatbar { position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: #0f2a18; border-bottom: 1px solid rgba(255, 255, 255, .1); }
.wordmark { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #e6c46e; }
.watchers { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(255, 255, 255, .12); font-size: 13px; }
.watchers svg { width: 16px; height: 16px; }
.chairs { position: absolute; top: 18px; left: 12px; right: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.wide .chairs { top: 20px; left: 40px; right: 40px; gap: 0 60px; grid-template-columns: repeat(3, 190px); justify-content: space-between; }
.wide .chairs .chair:nth-child(2) { margin-top: -4px; }
.wide .chairs .chair:nth-child(1), .wide .chairs .chair:nth-child(3) { margin-top: 60px; }
.chair { display: flex; flex-direction: column; align-items: center; gap: 0; }
.ctile { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; overflow: visible; display: grid; place-items: center; }
.ctile.seated { background: linear-gradient(170deg, #3a463e, #222b25); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .35); }
.face { width: 34%; aspect-ratio: 1; border-radius: 50% 50% 44% 44%; background: rgba(255, 255, 255, .14); }
.ctile.free { background: rgba(5, 20, 10, .55); border: 1.5px dashed rgba(255, 255, 255, .28); }
.sit { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, .12); color: #f3efe2; }
.sit svg { width: 22px; height: 22px; }
.plate { display: inline-flex; align-items: center; gap: 5px; margin-top: -11px; z-index: 1; padding: 3px 10px; border-radius: 4px; background: linear-gradient(180deg, #e2c272, #b08a36); color: #2a1d05; font-size: 12px; font-weight: 700; box-shadow: 0 1px 3px rgba(0, 0, 0, .4); white-space: nowrap; }
.plate.empty { background: linear-gradient(180deg, #8f8a7a, #6c6757); color: #1c1a14; }
.trick { position: absolute; top: 46%; left: 50%; translate: -50% -50%; display: flex; gap: 8px; }
.card { position: relative; display: inline-flex; flex-direction: column; align-items: flex-start; width: 44px; height: 64px; padding: 4px 5px; border-radius: 5px; background: #fbf8ef; color: #1b1b1b; font-weight: 700; font-size: 13px; line-height: 1.1; box-shadow: 0 1px 3px rgba(0, 0, 0, .45); }
.card b { font-size: 15px; }
.card.red { color: #b3261e; }
.bottom { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.hand { display: flex; }
.hand .card { margin-left: -14px; }
.hand .card:first-child { margin-left: 0; }
.wide .hand .card { margin-left: -6px; }
.strip { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; padding: 0 12px; }
.strip .banner { margin: 0; max-width: 360px; }
.pills { display: flex; gap: 10px; justify-content: center; }
.glass { position: relative; display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 16px; border: 1px solid rgba(255, 255, 255, .28); border-radius: 999px; background: rgba(255, 255, 255, .14); backdrop-filter: blur(8px); color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.glass svg { width: 16px; height: 16px; }
.glass:hover, .glass.pressed { background: rgba(255, 255, 255, .26); }
.glass.pressed { border-color: rgba(255, 255, 255, .6); }
.pill-anchor { position: relative; display: inline-flex; }
.anchor-panel { position: absolute; bottom: calc(100% + 10px); right: 0; width: 280px; padding: 4px 0; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); box-shadow: 0 10px 30px rgba(0, 0, 0, .45); text-align: left; }
.anchor-panel::after { content: ''; position: absolute; right: 44px; bottom: -6px; width: 10px; height: 10px; rotate: 45deg; background: var(--surface); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.anchor-panel .agent-control { padding-bottom: 0; }
</style>
</head>
<body>
<header class="page-head">
	<h1>Agenten rufen</h1>
	<button class="theme" id="theme" type="button">Hell / Dunkel</button>
</header>
<section class="scene"><h2>Das Zeichen für KI</h2><div class="frames"><figure><div class="frame legend"><div class="cand"><h3>Pille „KI“</h3><div class="agent-control lone"><ul><li class="agent"><span class="ai-mark">KI</span><span class="agent-name">Mozart</span><button class="act" type="button" aria-label="Mozart rufen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Rufen</button></li></ul></div><div class="plate-demo"><span class="plate"><span class="ai-mark">KI</span> Leonardo</span></div></div></div><figcaption>Die Pille steht in der Zeile und auf dem Namensschild.</figcaption></figure></div></section><section class="scene"><h2>1 · HopIn: das Menü „Mehr“ im Anruf</h2><div class="frames"><figure><div class="frame phone hopin"><div class="stage"><div class="vtile"><span class="vname">Felix</span></div><div class="vtile two"><span class="vname"><span class="ai-mark">KI</span> Leonardo</span></div></div><div class="cbar"><span class="cbtn mic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span><span class="cbtn cam"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg></span><span class="cbtn more on"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></span><span class="cbtn leave"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15c5-5 11-5 16 0l-2 3-3-2v-2a10 10 0 0 0-6 0v2l-3 2z"/></svg></span></div><div class="scrim"></div><div class="sheet"><span class="grabber"></span><div class="menu"><button class="mrow" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Anruf sperren</button><div class="mhead">Agenten</div><div class="agent-control"><ul><li class="agent"><s
