[project]
name = "overnightworks-design"
version = "0.33.1"
description = "Family design tokens and fonts shared by overnightworks products"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
catalogs = ["babel>=2.18,<3"]

[project.scripts]
design-catalogs = "design.catalogs.command:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "pytest-xdist>=3", "ruff>=0.15"]

[build-system]
requires = ["uv_build>=0.10,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "design"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.design-catalogs]
source = "de"
catalogs = "src/catalogs"
typescript = "src/lib/words"
python = "src/design/words.py"

[tool.coverage.run]
relative_files = true
# Generated by design-catalogs: tests/catalogs/test_python_module.py proves its logic, `--check` its content, and the kit has no plural family.
omit = ["src/design/words.py"]

[tool.ruff]
src = [".", "src"]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
    "RET",    # flake8-return
    "PT",     # flake8-pytest-style
]
# quality owns S and T20; its noqa lines would read as unused here
external = ["S", "T20"]

[tool.ruff.lint.per-file-ignores]
"src/design/words.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
